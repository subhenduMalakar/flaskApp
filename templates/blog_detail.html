{% extends "base.html" %}

{% block title %}{{ post.title }} - DirectoryExplorer{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h1 class="mb-3">{{ post.title }}</h1>
            <p class="text-muted">By {{ post.author }} on {{ post.date }}</p>
            <div class="blog-content">
                {{ post.content | safe }}
            </div>
            <a href="{{ url_for('blog') }}" class="btn btn-secondary mt-4">Back to Blog</a>
        </div>
    </div>
</div>
{% endblock %}
